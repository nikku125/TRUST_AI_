<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustGuard AI - Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>TrustGuard AI</h1>
            <p>Paste your news or message below to verify its authenticity.</p>
        </header>

        <main>
            <div class="input-section">
                <textarea id="messageInput" placeholder="Paste text here..."></textarea>
                <button id="analyzeBtn">Analyze Text</button>
            </div>

            <div id="resultSection" class="hidden">
                <h2>Analysis Result</h2>
                <div id="resultCard" class="card">
                    <span id="resultLabel"></span>
                    <div class="confidence-bar">
                        <div id="confidenceFill"></div>
                    </div>
                    <p>Confidence: <span id="confidenceScore"></span>%</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 TrustGuard AI. Promoting Digital Safety.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
